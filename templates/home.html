<html>
  <head>
    <title>Spotify Clone</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        background: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }

      .navbar {
        background: #000;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        color: #1db954;
        font-size: 28px;
        font-weight: bold;
      }

      .search-box {
        width: 500px;
      }

      .search-box input {
        width: 100%;
        padding: 10px;
        border-radius: 25px;
        border: none;
      }

      .user-area {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .logout-btn {
        background: red;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
      }

      .container {
        padding: 30px;
      }

      .song-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }

      .song-card {
        background: #181818;
        border-radius: 15px;
        overflow: hidden;
        transition: 0.3s;
      }

      .song-card:hover {
        transform: scale(1.05);
      }

      .song-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
      }

      .song-info {
        padding: 15px;
      }

      .song-title {
        font-size: 16px;
        font-weight: bold;
      }

      .play-btn {
        width: 100%;
        background: #1db954;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 20px;
        margin-top: 10px;
      }

      audio {
        width: 100%;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">Spotify Clone</div>

      <form action="{% url 'search_song' %}" method="GET" class="search-box">
        <input
          type="text"
          name="q"
          placeholder="Search songs..."
          value="{{ request.GET.q }}"
        />
      </form>

      <div class="user-area">
        <span> {{ request.user.username }} </span>

        <a href="/logout/" class="logout-btn"> Logout </a>
      </div>
    </nav>

    <div class="container">
      <h2>Trending Songs</h2>

      <div class="song-grid">
        {% for song in songs %}

        <div class="song-card">
          <img src="{{ song.image }}" />

          <div class="song-info">
            <div class="song-title">{{ song.name }}</div>

            <p>{{ song.artist }}</p>

            {% if song.preview_url %}

            <audio controls>
              <source src="{{ song.preview_url }}" type="audio/mpeg" />
            </audio>

            {% else %}

            <a href="{{ song.spotify_url }}" target="_blank">
              <button class="play-btn">Play On Spotify</button>
            </a>

            {% endif %}
          </div>
        </div>

        {% endfor %}
      </div>
    </div>
  </body>
</html>
