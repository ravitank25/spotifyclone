<!DOCTYPE html>
<html>
<head>
    <title>Saved Songs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-black text-white">
<div class="container mt-5">
    <div class="card bg-dark border-0">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="text-success">Saved Songs</h2>
                    <p class="text-muted">Songs you saved from search results.</p>
                </div>
                <a href="/" class="btn btn-outline-light">Home</a>
            </div>

            {% if songs %}
                <div class="row g-4">
                    {% for song in songs %}
                        <div class="col-md-4">
                            <div class="card bg-dark text-white h-100">
                                <img src="{{ song.image }}" class="card-img-top" alt="{{ song.name }}">
                                <div class="card-body">
                                    <h5 class="card-title">{{ song.name }}</h5>
                                    <p class="card-text">{{ song.artist }}</p>
                                    <a href="{{ song.spotify_url }}" target="_blank" class="btn btn-success btn-sm">Play on Spotify</a>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="alert alert-secondary">
                    You have no saved songs yet. Search for songs and save them here.
                </div>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
