<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: linear-gradient(135deg, #000000, #121212);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card{
            width: 100%;
            max-width: 430px;
            background-color: #181818;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0px 0px 40px rgba(0,0,0,0.8);
        }

        .spotify-logo{
            font-size: 60px;
            color: #1DB954;
        }

        .title{
            color: white;
            font-weight: bold;
            margin-top: 15px;
        }

        .subtitle{
            color: #b3b3b3;
            font-size: 14px;
        }

        label{
            color: white;
            margin-top: 15px;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-control{
            background-color: #282828;
            border: 1px solid #333;
            color: white;
            height: 50px;
            border-radius: 12px;
            padding-left: 15px;
        }

        .form-control::placeholder{
            color: #b3b3b3;
            opacity: 1;
        }

        .form-control:focus{
            background-color: #282828;
            color: white;
            border: 1px solid #1DB954;
            box-shadow: none;
        }

        .btn-login{
            background-color: #1DB954;
            border: none;
            color: white;
            height: 50px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 25px;
            transition: 0.3s;
        }

        .btn-login:hover{
            background-color: #18a74a;
            transform: scale(1.02);
        }

        .divider{
            text-align: center;
            color: #b3b3b3;
            margin: 25px 0;
            position: relative;
        }

        .divider::before{
            content: "";
            position: absolute;
            width: 40%;
            height: 1px;
            background-color: #444;
            left: 0;
            top: 50%;
        }

        .divider::after{
            content: "";
            position: absolute;
            width: 40%;
            height: 1px;
            background-color: #444;
            right: 0;
            top: 50%;
        }

        .google-btn{
            background-color: white;
            color: black;
            height: 50px;
            border-radius: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            text-decoration: none;
        }

        .google-btn:hover{
            background-color: #f1f1f1;
        }

        .signup-btn{
            background-color: transparent;
            border: 1px solid #444;
            color: white;
            height: 50px;
            border-radius: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            text-decoration: none;
            transition: 0.3s;
        }

        .signup-btn:hover{
            background-color: #282828;
            border: 1px solid #1DB954;
            color: white;
        }

    </style>

</head>

<body>

<div class="login-card">

    <!-- Logo -->
    <div class="text-center">

        <i class="bi bi-spotify spotify-logo"></i>

        <h2 class="title">
            Welcome Back
        </h2>

        <p class="subtitle">
            Login to continue your music journey
        </p>

    </div>

    <!-- Login Form -->
    <form method="POST">

        {% csrf_token %}

        <label>
            Username
        </label>

        <input type="text"
               name="username"
               class="form-control"
               placeholder="Enter your username">

        <label>
            Password
        </label>

        <input type="password"
               name="password"
               class="form-control"
               placeholder="Enter your password">

        <button class="btn btn-login w-100">
            Login
        </button>

    </form>

    <!-- Divider -->
    <div class="divider">
        OR
    </div>

    <!-- Google Login -->
    <a href="/accounts/google/login/"
       class="google-btn w-100">

        <i class="bi bi-google text-danger"></i>

        Continue With Google

    </a>

    <!-- Signup -->
    <a href="/signup/"
       class="signup-btn w-100">

        Create New Account

    </a>

</div>

</body>

</html>
